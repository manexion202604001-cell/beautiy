# Local development dependencies for Salon OS
#   docker compose -f infra/docker-compose.yml up -d
# Services: PostgreSQL 16, MinIO (S3 compatible object storage), Mailpit (SMTP sink + web UI)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: salon
      MINIO_ROOT_PASSWORD: salon-secret
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  # Full stack (optional): build images from this repo
  api:
    profiles: ["full"]
    build: { context: .., dockerfile: apps/api/Dockerfile }
    env_file: ../apps/api/.env
    environment:
      DATABASE_URL: postgres://salon:salon@postgres:5432/salon
      NODE_ENV: production
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["4000:4000"]

  worker:
    profiles: ["full"]
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    env_file: ../apps/api/.env
    environment:
      DATABASE_URL: postgres://salon:salon@postgres:5432/salon
      NODE_ENV: production
    depends_on: { postgres: { condition: service_healthy } }

  web:
    profiles: ["full"]
    build: { context: .., dockerfile: apps/web/Dockerfile }
    environment:
      API_UPSTREAM: http://api:4000
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
  miniodata:
