<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Salon OS 自動枠止め</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1d1d1f;
        --muted: #6e6e73;
        --line: #d2d2d7;
        --bg: #fff;
        --ok: #1a7f37;
        --ng: #c62828;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f5f5f7;
          --muted: #a1a1a6;
          --line: #3a3a3c;
          --bg: #1c1c1e;
        }
      }
      body {
        font:
          14px/1.6 -apple-system,
          'Hiragino Sans',
          sans-serif;
        color: var(--fg);
        background: var(--bg);
        margin: 0;
        padding: 16px;
        min-width: 380px;
        max-width: 640px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      p.lead {
        color: var(--muted);
        margin: 0 0 16px;
        font-size: 13px;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 12px 0 4px;
      }
      input[type='text'],
      input[type='password'] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: #0a66d8;
        border-color: #0a66d8;
        color: #fff;
      }
      .check {
        display: flex;
        gap: 8px;
        align-items: center;
        font-weight: normal;
      }
      #status {
        margin-top: 16px;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid var(--line);
      }
      .ok {
        color: var(--ok);
      }
      .ng {
        color: var(--ng);
      }
      ol {
        padding-left: 18px;
        margin: 8px 0 0;
        font-size: 12px;
        color: var(--muted);
      }
      small {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>Salon OS 自動枠止め</h1>
    <p class="lead">
      Salon OS の予約に合わせて、minimo の「すぐ予約」枠を10分ごとに止め・再開します。このChromeの
      minimo のログインを使います（パスワードは保存しません）。
    </p>

    <label for="token">トークン</label>
    <input
      id="token"
      type="password"
      autocomplete="off"
      placeholder="sa_…（Salon OS の 外部連携 → 予約媒体 → 自動枠止め で発行）"
    />

    <label class="check"><input id="minimo" type="checkbox" checked /> minimo の枠を止める</label>

    <details>
      <summary><small>Salon OS のアドレス</small></summary>
      <input id="baseUrl" type="text" placeholder="https://salon-os-web.onrender.com" />
    </details>

    <div class="row">
      <button id="save" class="primary">保存</button>
      <button id="run">今すぐ実行</button>
    </div>

    <div id="status">まだ実行していません</div>
    <ol id="history"></ol>
    <script src="options.js" type="module"></script>
  </body>
</html>
