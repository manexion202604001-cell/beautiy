name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # cluster admin (superuser); the tests connect as the non-superuser `salon` role created below
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://salon:salon@localhost:5432/salon_test
    steps:
      - uses: actions/checkout@v4
      # Superusers bypass row-level security, so the tenant-isolation tests are only meaningful as an
      # ordinary role. Same script as docker-compose: role `salon` + databases `salon` / `salon_test`.
      - name: Create the application role and databases
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres < infra/postgres-init.sql
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @salon/api lint
      - run: pnpm --filter @salon/api typecheck
      - run: pnpm --filter @salon/api test
      - run: pnpm --filter @salon/api build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @salon/web lint
      - run: pnpm --filter @salon/web typecheck
      - run: pnpm --filter @salon/web test
      - run: pnpm --filter @salon/web build
