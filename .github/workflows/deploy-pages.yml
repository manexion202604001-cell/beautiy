name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/minimal-luxury-design-pmq9zt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # デモモード: ハッシュルーティング + 相対パスで Pages のサブパス配信に対応
      - run: npx vite build --base=./
        env:
          VITE_DEMO_HASH_ROUTER: '1'
      # 実運用アプリ（/app/ 配下）: Supabase接続版
      # publishable キーはクライアント配布前提の公開キー（データ保護はRLS）
      - run: npx vite build --base=./ --outDir=dist/app
        env:
          VITE_DEMO_HASH_ROUTER: '1'
          VITE_SUPABASE_URL: https://yfxubvdgdgvtogwrggmg.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_QW9pxuzWHJuQCJqBhKcsJw_y3PJAzre
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
